[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcolor"
version = "1.0.1"
description = "Smart color printing for deep-learning types, numbers and strings."
readme = "README.md"
requires-python = ">=3.7"
authors = [{ name = "pcolor" }]
keywords = ["print", "color", "torch", "deep-learning", "terminal"]

[tool.setuptools]
packages = ["pcolor"]
